version: 2

# One PR bumps the ruff/pre-commit pins (dev-requirements.txt) AND the
# ruff-pre-commit hook rev (.pre-commit-config.yaml) together. Same-named
# per-ecosystem `groups` do NOT merge across ecosystems — this top-level
# key is the supported mechanism (dependabot multi-ecosystem updates).
multi-ecosystem-groups:
  tooling:
    schedule:
      interval: "monthly"

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # Owned by the 'tooling' multi-ecosystem group below.
    ignore:
      - dependency-name: "ruff"
      - dependency-name: "pre-commit"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Second entries for the same ecosystem+directory are allowed; they feed
  # only the multi-ecosystem group (matched by `patterns`), on its schedule.
  - package-ecosystem: "pip"
    directory: "/"
    patterns: ["ruff", "pre-commit"]
    multi-ecosystem-group: "tooling"

  - package-ecosystem: "pre-commit"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "tooling"
