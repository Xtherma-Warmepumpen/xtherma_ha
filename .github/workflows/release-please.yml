name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release please
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Preflight release-please manifest
        run: |
          # release-please keys the versions file by package path (v17 core/manifest.ts
          # parseReleasedVersions). A branch-keyed file (e.g. "branches/main") is parsed
          # as an unknown path and silently drops the package to its initial 1.0.0.
          if ! jq -e 'has(".")' .release-please-manifest.json > /dev/null; then
            echo "::error::.release-please-manifest.json must contain a \".\" path key (the released version), not branch keys"
            exit 1
          fi

      - name: Run release-please
        id: release_please
        uses: googleapis/release-please-action@v4

      - name: Check out release tag ${{ steps.release_please.outputs.tag_name }}
        if: ${{ steps.release_please.outputs.release_created == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release_please.outputs.tag_name }}

      - name: Assert manifest.json version matches release tag
        if: ${{ steps.release_please.outputs.release_created == 'true' }}
        run: |
          tag='${{ steps.release_please.outputs.tag_name }}'
          manifest_version="$(jq -r '.version' custom_components/xtherma_fp/manifest.json)"
          if [ "v${manifest_version}" != "${tag}" ]; then
            echo "::error::manifest.json version v${manifest_version} does not match release tag ${tag}"
            exit 1
          fi
